# Demo Secret for local development only
# Do NOT use plaintext secrets like this in production. Use an external secret manager
# or platform secret store (Vault, AWS Secrets Manager, Azure Key Vault, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: devops-demo
type: Opaque
stringData:
  # demo values (base64 not required when using stringData)
  DB_USER: "appuser"
  DB_PASSWORD: "password" # DEMO PASSWORD — replace in production
  DB_NAME: "appdb"
